<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habits</title>
    <style>
      :root {
        --bg: #12101e;
        --card: #1e1a2e;
        --card-soft: #2a2440;
        --line: rgba(255, 255, 255, 0.06);
        --text: #d4c8f0;
        --muted: #9888b8;
        --lavender: #c4b5f4;
        --blue: #a8c4f8;
        --mint: #b8d8f0;
        --pink: #f4a8c8;
        --sky: #a8c4f8;
        --peach: #f4c4a8;
        --lilac: #e0b8f4;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-rounded,
          "SF Pro Rounded",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
        padding: 32px 16px 80px;
      }
      .wrap {
        max-width: 680px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 28px;
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .date {
        color: var(--muted);
        font-size: 14px;
        margin-top: 4px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 16px;
      }

      /* ---------- water ---------- */
      .water-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 14px;
      }
      .card-title {
        font-size: 15px;
        font-weight: 600;
      }
      .water-count {
        font-size: 13px;
        color: var(--muted);
      }
      .cups {
        display: flex;
        gap: 8px;
      }
      .cup {
        flex: 1;
        height: 44px;
        border-radius: 8px 8px 11px 11px;
        border: 1.5px solid var(--sky);
        background: transparent;
        cursor: pointer;
        transition:
          background 0.15s,
          opacity 0.15s;
        opacity: 0.45;
      }
      .cup.full {
        background: var(--sky);
        opacity: 1;
      }
      .cup:hover {
        opacity: 0.8;
      }
      .cup:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }

      /* ---------- add habit ---------- */
      .add-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .add-row input[type="text"] {
        flex: 1;
        min-width: 160px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 10px 14px;
        font-size: 14px;
        font-family: inherit;
      }
      .add-row input[type="text"]:focus {
        outline: none;
        border-color: var(--lavender);
      }
      .swatches {
        display: flex;
        gap: 8px;
      }
      .swatch {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.12s;
      }
      .swatch:hover {
        transform: scale(1.12);
      }
      .swatch.selected {
        border-color: var(--text);
      }
      .swatch:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .add-btn {
        background: var(--lavender);
        color: #1a1a2e;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .add-btn:hover {
        filter: brightness(1.08);
      }

      /* ---------- habit card ---------- */
      .habit-top {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .check {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid;
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        transition: background 0.15s;
        font-size: 18px;
        color: #1a1a2e;
      }
      .check .tick {
        opacity: 0;
        transition: opacity 0.15s;
      }
      .check.done .tick {
        opacity: 1;
      }
      .check:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .habit-info {
        flex: 1;
        min-width: 0;
      }
      .habit-name {
        font-size: 16px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .streak {
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }
      .habit-actions {
        display: flex;
        gap: 6px;
      }
      .icon-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        padding: 6px 8px;
        border-radius: 8px;
        font-family: inherit;
      }
      .icon-btn:hover {
        background: var(--card-soft);
        color: var(--text);
      }

      .progress-row {
        margin-top: 14px;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .bar {
        height: 8px;
        background: var(--bg);
        border-radius: 99px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 99px;
        transition: width 0.3s ease;
      }

      /* ---------- heatmap ---------- */
      .heatmap-wrap {
        margin-top: 16px;
        display: none;
      }
      .heatmap-wrap.open {
        display: block;
      }
      .heatmap-scroll {
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .heatmap {
        display: grid;
        grid-template-rows: repeat(7, 9px);
        grid-auto-flow: column;
        grid-auto-columns: 9px;
        gap: 2.5px;
      }
      .hm-cell {
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.06);
      }
      .hm-cell.future {
        background: rgba(255, 255, 255, 0.025);
      }
      .hm-legend {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        padding: 28px 0;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Habits</h1>
        <div class="date" id="todayLabel"></div>
      </header>

      <!-- Water tracker -->
      <div class="card">
        <div class="water-head">
          <div class="card-title">Water</div>
          <div class="water-count" id="waterCount"></div>
        </div>
        <div class="cups" id="cups"></div>
      </div>

      <!-- Add habit -->
      <div class="card">
        <div class="add-row">
          <input
            type="text"
            id="habitName"
            placeholder="New habit name"
            maxlength="40"
          />
          <div class="swatches" id="swatches"></div>
          <button class="add-btn" id="addBtn">Add</button>
        </div>
      </div>

      <!-- Habit list -->
      <div id="habitList"></div>
    </div>

    <script>
      (function () {
        "use strict";

        var COLORS = [
          { name: "Lavender", hex: "#b9a7e8" },
          { name: "Mint", hex: "#9fe6c3" },
          { name: "Pink", hex: "#ffb3c8" },
          { name: "Sky", hex: "#9fd4f2" },
        ];
        var STORE_KEY = "habitTrackerData";

        /* ---------- storage (localStorage with in-memory fallback) ---------- */
        var memoryStore = null;
        function loadData() {
          try {
            var raw = localStorage.getItem(STORE_KEY);
            if (raw) return JSON.parse(raw);
          } catch (e) {
            if (memoryStore) return memoryStore;
          }
          return { habits: [], water: {} };
        }
        function saveData(d) {
          memoryStore = d;
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(d));
          } catch (e) {}
        }

        var data = loadData();
        if (!data.habits) data.habits = [];
        if (!data.water) data.water = {};

        /* ---------- date helpers (local calendar dates) ---------- */
        function dateKey(d) {
          var y = d.getFullYear();
          var m = String(d.getMonth() + 1).padStart(2, "0");
          var day = String(d.getDate()).padStart(2, "0");
          return y + "-" + m + "-" + day;
        }
        function todayKey() {
          return dateKey(new Date());
        }
        function addDays(d, n) {
          var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
          x.setDate(x.getDate() + n);
          return x;
        }
        function daysInCurrentMonth() {
          var now = new Date();
          return new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        }

        /* ---------- streak: walk back through real calendar days ---------- */
        function calcStreak(habit) {
          var done = habit.completions || {};
          var today = new Date();
          var streak = 0;
          var cursor;
          if (done[dateKey(today)]) {
            cursor = today;
          } else if (done[dateKey(addDays(today, -1))]) {
            cursor = addDays(today, -1); // missed today so far, but streak from yesterday still alive
          } else {
            return 0;
          }
          while (done[dateKey(cursor)]) {
            streak++;
            cursor = addDays(cursor, -1);
          }
          return streak;
        }

        function monthCompletions(habit) {
          var now = new Date();
          var prefix =
            now.getFullYear() +
            "-" +
            String(now.getMonth() + 1).padStart(2, "0") +
            "-";
          var count = 0;
          for (var k in habit.completions) {
            if (habit.completions[k] && k.indexOf(prefix) === 0) count++;
          }
          return count;
        }

        /* ---------- color utils ---------- */
        function hexToRgba(hex, a) {
          var r = parseInt(hex.slice(1, 3), 16);
          var g = parseInt(hex.slice(3, 5), 16);
          var b = parseInt(hex.slice(5, 7), 16);
          return "rgba(" + r + "," + g + "," + b + "," + a + ")";
        }

        /* ---------- water ---------- */
        function renderWater() {
          var tk = todayKey();
          var count = data.water[tk] || 0;
          var cupsEl = document.getElementById("cups");
          cupsEl.innerHTML = "";
          for (var i = 0; i < 8; i++) {
            (function (idx) {
              var b = document.createElement("button");
              b.className = "cup" + (idx < count ? " full" : "");
              b.setAttribute("aria-label", "Cup " + (idx + 1));
              b.addEventListener("click", function () {
                var cur = data.water[todayKey()] || 0;
                data.water[todayKey()] = idx + 1 === cur ? idx : idx + 1;
                saveData(data);
                renderWater();
              });
              cupsEl.appendChild(b);
            })(i);
          }
          document.getElementById("waterCount").textContent =
            count + " / 8 cups";
        }

        /* ---------- heatmap ---------- */
        function buildHeatmap(habit) {
          var year = new Date().getFullYear();
          var start = new Date(year, 0, 1);
          var end = new Date(year, 11, 31);
          var today = new Date();
          var grid = document.createElement("div");
          grid.className = "heatmap";

          // pad to align Jan 1 with its weekday row (Sunday = row 0)
          for (var p = 0; p < start.getDay(); p++) {
            var pad = document.createElement("div");
            pad.style.width = "9px";
            pad.style.height = "9px";
            grid.appendChild(pad);
          }

          var cursor = start;
          while (cursor <= end) {
            var cell = document.createElement("div");
            cell.className = "hm-cell";
            var key = dateKey(cursor);
            if (habit.completions && habit.completions[key]) {
              cell.style.background = habit.color;
            } else if (cursor > today) {
              cell.className += " future";
            }
            cell.title = key;
            grid.appendChild(cell);
            cursor = addDays(cursor, 1);
          }
          return grid;
        }

        /* ---------- habit list ---------- */
        function renderHabits() {
          var list = document.getElementById("habitList");
          list.innerHTML = "";

          if (data.habits.length === 0) {
            var e = document.createElement("div");
            e.className = "empty";
            e.textContent = "No habits yet. Add one above to start tracking.";
            list.appendChild(e);
            return;
          }

          var tk = todayKey();
          var dim = daysInCurrentMonth();

          data.habits.forEach(function (habit) {
            var card = document.createElement("div");
            card.className = "card";

            var top = document.createElement("div");
            top.className = "habit-top";

            // check button
            var doneToday = !!(habit.completions && habit.completions[tk]);
            var check = document.createElement("button");
            check.className = "check" + (doneToday ? " done" : "");
            check.style.borderColor = habit.color;
            check.style.background = doneToday ? habit.color : "transparent";
            check.setAttribute(
              "aria-label",
              (doneToday ? "Mark not done: " : "Mark done: ") + habit.name,
            );
            check.innerHTML = '<span class="tick">&#10003;</span>';
            check.addEventListener("click", function () {
              if (!habit.completions) habit.completions = {};
              var k = todayKey();
              if (habit.completions[k]) delete habit.completions[k];
              else habit.completions[k] = true;
              saveData(data);
              renderHabits();
            });

            // name + streak
            var info = document.createElement("div");
            info.className = "habit-info";
            var nameEl = document.createElement("div");
            nameEl.className = "habit-name";
            nameEl.textContent = habit.name;
            var streakEl = document.createElement("div");
            streakEl.className = "streak";
            var s = calcStreak(habit);
            streakEl.textContent = "\uD83D\uDD25 " + s + " day streak";
            info.appendChild(nameEl);
            info.appendChild(streakEl);

            // actions
            var actions = document.createElement("div");
            actions.className = "habit-actions";
            var hmBtn = document.createElement("button");
            hmBtn.className = "icon-btn";
            hmBtn.textContent = "Year";
            var delBtn = document.createElement("button");
            delBtn.className = "icon-btn";
            delBtn.textContent = "Delete";
            delBtn.addEventListener("click", function () {
              if (confirm('Delete "' + habit.name + '" and all its history?')) {
                data.habits = data.habits.filter(function (h) {
                  return h.id !== habit.id;
                });
                saveData(data);
                renderHabits();
              }
            });
            actions.appendChild(hmBtn);
            actions.appendChild(delBtn);

            top.appendChild(check);
            top.appendChild(info);
            top.appendChild(actions);
            card.appendChild(top);

            // monthly progress
            var mc = monthCompletions(habit);
            var prog = document.createElement("div");
            prog.className = "progress-row";
            var label = document.createElement("div");
            label.className = "progress-label";
            label.innerHTML =
              "<span>This month</span><span>" +
              mc +
              " / " +
              dim +
              " days</span>";
            var bar = document.createElement("div");
            bar.className = "bar";
            var fill = document.createElement("div");
            fill.className = "bar-fill";
            fill.style.width = Math.round((mc / dim) * 100) + "%";
            fill.style.background = habit.color;
            bar.appendChild(fill);
            prog.appendChild(label);
            prog.appendChild(bar);
            card.appendChild(prog);

            // heatmap (lazy toggle)
            var hmWrap = document.createElement("div");
            hmWrap.className = "heatmap-wrap";
            hmBtn.addEventListener("click", function () {
              if (hmWrap.classList.contains("open")) {
                hmWrap.classList.remove("open");
                hmBtn.textContent = "Year";
              } else {
                hmWrap.innerHTML = "";
                var scroll = document.createElement("div");
                scroll.className = "heatmap-scroll";
                scroll.appendChild(buildHeatmap(habit));
                var legend = document.createElement("div");
                legend.className = "hm-legend";
                legend.textContent =
                  new Date().getFullYear() +
                  " \u00b7 filled squares are completed days";
                hmWrap.appendChild(scroll);
                hmWrap.appendChild(legend);
                hmWrap.classList.add("open");
                hmBtn.textContent = "Hide";
              }
            });
            card.appendChild(hmWrap);

            // soft tinted border in habit color
            card.style.borderColor = hexToRgba(habit.color, 0.18);

            list.appendChild(card);
          });
        }

        /* ---------- add habit ---------- */
        var selectedColor = COLORS[0].hex;
        function renderSwatches() {
          var box = document.getElementById("swatches");
          box.innerHTML = "";
          COLORS.forEach(function (c) {
            var s = document.createElement("button");
            s.className =
              "swatch" + (c.hex === selectedColor ? " selected" : "");
            s.style.background = c.hex;
            s.setAttribute("aria-label", c.name);
            s.title = c.name;
            s.addEventListener("click", function () {
              selectedColor = c.hex;
              renderSwatches();
            });
            box.appendChild(s);
          });
        }

        function addHabit() {
          var input = document.getElementById("habitName");
          var name = input.value.trim();
          if (!name) {
            input.focus();
            return;
          }
          data.habits.push({
            id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
            name: name,
            color: selectedColor,
            completions: {},
          });
          saveData(data);
          input.value = "";
          renderHabits();
        }

        document.getElementById("addBtn").addEventListener("click", addHabit);
        document
          .getElementById("habitName")
          .addEventListener("keydown", function (e) {
            if (e.key === "Enter") addHabit();
          });

        /* ---------- header date + midnight refresh ---------- */
        function renderDate() {
          document.getElementById("todayLabel").textContent =
            new Date().toLocaleDateString(undefined, {
              weekday: "long",
              month: "long",
              day: "numeric",
              year: "numeric",
            });
        }

        var lastDay = todayKey();
        setInterval(function () {
          if (todayKey() !== lastDay) {
            // crossed midnight: re-render so streaks/checks reset
            lastDay = todayKey();
            renderDate();
            renderWater();
            renderHabits();
          }
        }, 30000);

        renderDate();
        renderSwatches();
        renderWater();
        renderHabits();
      })();
    </script>
  </body>
</html>
