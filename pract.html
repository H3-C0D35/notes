<!-- ?Name (text) Gender (radio: Male/Female) Hobbies (checkboxes: Reading, Gaming, Sports) Submit button
?On submit, a JS function should display in a <p>: Name, Gender, List of hobbies
?Requirements: Use getElementById(), .value, .checked, loops if needed.
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
  <body>
    <div class="main">
      <form>
        <label for="name">Name: </label>
        <input id="name" type="text" placeholder="name" />
        <br /><br />

        <label id="g">Gender: </label><br />
        <input id="m" type="radio" value="Male" />Male
        <input id="f" type="radio" value="Female" />Female <br /><br />

        <label id="hobbies">Hobbies: </label><br />
        <input id="d" type="checkbox" value="Drawing" />Drawing<br />
        <input id="r" type="checkbox" value="Reading" />Reading<br />
        <input id="b" type="checkbox" value="Badminton" />Badminton<br />
        <input id="c" type="checkbox" value="Chess" />Chess<br />
        <input id="s" type="checkbox" value="Swimming" />Swimming<br />
        <input id="k" type="checkbox" value="Karate" />Karate<br /><br />

        <button type="button" onclick="handlesubmit()">Click</button>
      </form>
    </div>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>

    <script>
      function handlesubmit() {
        let name = document.getElementById("name").value;

        document.getElementById("demo1").innerHTML = "Name: " + name;

        let gender = "";
        if (document.getElementById("m").checked) {
          gender = "male";
        } else if (document.getElementById("f").checked) {
          gender = "female";
        }
        document.getElementById("demo2").innerHTML = "Gender: " + gender;

        let hobbies = [];
        if (document.getElementById("d").checked) hobbies.push("Drawing");
        if (document.getElementById("r").checked) hobbies.push("Reading");
        if (document.getElementById("b").checked) hobbies.push("Badminton");
        if (document.getElementById("c").checked) hobbies.push("Chess");
        if (document.getElementById("s").checked) hobbies.push("Swimming");
        if (document.getElementById("k").checked) hobbies.push("Karate");

        document.getElementById("demo3").innerHTML =
          "Hobbies: " + hobbies.join(", ");
      }
    </script>
  </body>
</html>

/* There are two types of elements: Block and Inline
Block elements take up full width of their container, start on a new line and respect the width, height, alignment of stuff while Inline elements take up as much width as their content, dont start on a new line and ignore all those things.
Because of this the bg color takes full container btu when we put display-inline, it doesnt repsect the alignment of text therefore put inline-block
without display, the whole line is colored.*/
